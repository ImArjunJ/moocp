name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Verify tag matches executable
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          task_version=$(./target/release/moocp --version | cut -d ' ' -f 2)
          test "$GITHUB_REF_NAME" = "v$task_version"
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          MOOCP_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp target/release/moocp dist/package/
          cp README.md LICENSE SETUP.md dist/package/
          task_archive="moocp-$MOOCP_RELEASE_TARGET.tar.gz"
          tar -czf "dist/$task_archive" -C dist/package .
          (cd dist && shasum -a 256 "$task_archive") > "dist/$task_archive.sha256"
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOOCP_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path dist/package -Force
          Copy-Item target/release/moocp.exe dist/package/
          Copy-Item README.md,LICENSE,SETUP.md dist/package/
          $archive = "dist/moocp-$env:MOOCP_RELEASE_TARGET.zip"
          Compress-Archive -Path dist/package/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: moocp-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: moocp-*
          path: dist
          merge-multiple: true
      - name: Publish release with native downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/moocp-release-notes.md <<'NOTES'
          Moodle for your AI CLI.

          Paste the setup prompt from the README into your agent, or use the native installers. Sign in through your university in the browser.

          Native downloads for Linux x64/ARM64, macOS Intel/Apple silicon, and Windows x64. Every archive has a SHA-256 file. Chrome, Chromium, or Edge is required for browser sign-in.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/moocp-release-notes.md --verify-tag --latest
